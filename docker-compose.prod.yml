x-backend-environment: &backend-environment
  NODE_ENV: production
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://recep.cymezapi.com}
  DB_HOST: ${DB_HOST:?Set DB_HOST in .env.production}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
  DB_USER: ${DB_USER:?Set DB_USER in .env.production}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
  DB_EXTERNAL_HOST: ${DB_EXTERNAL_HOST:?Set DB_EXTERNAL_HOST in .env.production}
  DB_EXTERNAL_PORT: ${DB_EXTERNAL_PORT:-3306}
  DB_EXTERNAL_DATABASE: ${DB_EXTERNAL_DATABASE:?Set DB_EXTERNAL_DATABASE in .env.production}
  DB_EXTERNAL_USERNAME: ${DB_EXTERNAL_USERNAME:?Set DB_EXTERNAL_USERNAME in .env.production}
  DB_EXTERNAL_PASSWORD: ${DB_EXTERNAL_PASSWORD:?Set DB_EXTERNAL_PASSWORD in .env.production}
  INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN:-}
  APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Mexico_City}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the public HTTPS URL in .env.production}
  FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
  FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
  FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - private
      - coolify

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *backend-environment
    volumes:
      - app_releases:/app/backend/app-releases
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - private
      - coolify

  migrate:
    build:
      context: .
      target: api
    restart: "no"
    command: ["bun", "run", "--filter", "visitas-backend", "db:migrate"]
    environment: *backend-environment
    volumes:
      - app_releases:/app/backend/app-releases
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private
      - coolify

networks:
  private:
    driver: bridge
  coolify:
    external: true

volumes:
  app_releases:
